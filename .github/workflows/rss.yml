name: 更新 RSS 订阅源

on:
  # 每天 UTC 04:17 = 北京时间 12:17 自动跑一次
  schedule:
    - cron: '17 4 * * *'
  # 也可以在 Actions 页面手动点“Run workflow”
  workflow_dispatch:

# 需要写权限才能把生成好的 xml 提交回仓库
permissions:
  contents: write

# 避免多次运行互相打架
concurrency:
  group: rss-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成订阅文件（失败自动等待后重试）
        run: |
          for i in 1 2 3; do
            if node manhuagui-rss.mjs --config feeds.json; then
              exit 0
            fi
            echo "::warning::第 $i 次抓取失败，5 分钟后重试"
            sleep 300
          done
          echo "::error::三次尝试均失败，本次不更新订阅文件"
          exit 1

      - name: 生成中国政府网「最新政策」订阅
        run: |
          for i in 1 2 3; do
            if node govcn-rss.mjs --out govcn-feed.xml --limit 100; then
              exit 0
            fi
            echo "::warning::第 $i 次抓取失败，3 分钟后重试"
            sleep 180
          done
          echo "::error::中国政府网数据源三次抓取均失败"
          exit 1

      - name: 校验 XML
        run: |
          for f in *.xml; do
            python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('$f'); print('$f OK')"
          done

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.xml' '.feed-state.json'
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 RSS 订阅源 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
