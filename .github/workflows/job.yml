name: job

on:
  schedule:
    # 每小时一次（UTC 每小时第 17 分钟 = 北京时间每小时的 17 分）
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job
  cancel-in-progress: false

jobs:
  build:
    # 固定版本，避免 ubuntu-latest 迁移带来的意外
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: run a
        run: |
          for i in 1 2 3; do
            if node gen-a.mjs --config config.json; then
              exit 0
            fi
            sleep 300
          done
          exit 1

      - name: run c
        run: |
          for i in 1 2 3; do
            if node gen-c.mjs --out feed-c.xml --limit 100 --with-content --content-limit 20 \
                 --guid-version 4 \
                 --self "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/feed-c.xml"; then
              exit 0
            fi
            sleep 180
          done
          exit 1

      # 空间接口有风控，失败不影响其它源，也不让整个任务变红
      - name: run d
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if node gen-d.mjs --out feed-d.xml --limit 30 \
                 --self "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/feed-d.xml"; then
              exit 0
            fi
            sleep 60
          done
          echo "::warning::run d failed"
          exit 1

      - name: check
        run: |
          for f in *.xml; do
            python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('$f')"
          done

      - name: push
        run: |
          git config user.name  "bot"
          git config user.email "bot@users.noreply.github.com"

          # 远端可能已被上一次运行或本地推送推进，先把工作区对齐到远端最新，
          # 再基于它提交，避免 non-fast-forward 导致 push 失败
          if git fetch origin "${GITHUB_REF_NAME}" --depth=1; then
            git reset --soft FETCH_HEAD
          fi

          git add -A -- '*.xml' '.s-a.json' '.s-c.json'
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "update"

          # 万一仍然被拒（例如刚好有人同时推送），退一步重取远端再推一次
          if ! git push; then
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft FETCH_HEAD
            git add -A -- '*.xml' '.s-a.json' '.s-c.json'
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -m "update"
            git push
          fi
