name: job

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: run a
        run: |
          for i in 1 2 3; do
            if node gen-a.mjs --config config.json; then
              exit 0
            fi
            sleep 300
          done
          exit 1

      - name: run c
        run: |
          for i in 1 2 3; do
            if node gen-c.mjs --out feed-c.xml --limit 100 --with-content --content-limit 20 \
                 --self "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/feed-c.xml"; then
              exit 0
            fi
            sleep 180
          done
          exit 1

      - name: check
        run: |
          for f in *.xml; do
            python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('$f')"
          done

      - name: push
        run: |
          git config user.name  "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- '*.xml' '.s-a.json' '.s-c.json'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "update"
          git push
